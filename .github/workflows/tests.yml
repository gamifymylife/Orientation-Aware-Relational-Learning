name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: python -m pip install -e '.[dev,dream4]'
      - name: Current benchmark tests
        run: pytest -q
      - name: DREAM4 corrected harness tests
        run: pytest -q external/dream4/v02/tests
