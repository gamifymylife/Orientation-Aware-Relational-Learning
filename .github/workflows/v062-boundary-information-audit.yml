name: v0.6.2 boundary information audit

on:
  pull_request:
    paths:
      - 'scripts/run_v062_boundary_information_audit.py'
      - 'evidence/v062/**'
      - '.github/workflows/v062-boundary-information-audit.yml'
      - 'paper/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OARL
        run: pip install -e '.[dev]'
      - name: Install pinned pyGSTi
        run: pip install 'pygsti==0.10.2'
      - name: Run frozen v0.6.2 audit
        run: python scripts/run_v062_boundary_information_audit.py --out evidence/v062/outputs
      - name: Verify output integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('evidence/v062/outputs/summary.json').read_text())
          assert data['version'] == 'v0.6.2-boundary-information-audit'
          assert data['parameter_directions'] == ['uniform_rotation_x', 'uniform_rotation_y', 'uniform_rotation_z']
          assert data['max_depth'] == 6
          assert data['initial_boundary']['depth'] == 1
          assert data['initial_boundary']['probe_count'] == 2
          assert data['probe_count'] == 126
          print('science gate_pass =', data['gate_pass'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v062-boundary-information-audit
          path: evidence/v062/outputs
