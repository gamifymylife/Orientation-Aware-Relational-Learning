name: expand consolidation payload

on:
  push:
    branches: [consolidate-research-evidence]

permissions:
  contents: write

jobs:
  expand:
    if: github.event.head_commit.message == 'Run final payload repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate-research-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Expand payload
        run: python .bootstrap/bootstrap.py
      - name: Install and test
        run: |
          python -m pip install -e '.[dev,dream4]'
          pytest -q
          pytest -q external/dream4/v02/tests
      - name: Commit expanded repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf src/*.egg-info
          rm -f .github/workflows/tests.yml
          git add -A
          git commit -m "Expand consolidated OARL research archive"
          git push origin HEAD:consolidate-research-evidence
