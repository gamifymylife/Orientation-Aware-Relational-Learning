[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orientation-aware-relational-learning"
version = "0.4.0"
description = "Boundary-aware mechanism identification with certified orientation equivalence and risk-aware quotienting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dream4 = ["scipy>=1.10", "scikit-learn>=1.3"]

[project.scripts]
oarl-bench = "oarl_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
